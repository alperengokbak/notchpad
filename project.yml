name: Notchpad
options:
  bundleIdPrefix: com.alperengokbak
  deploymentTarget:
    macOS: "14.0"
packages:
  NotchpadCore:
    path: Packages/NotchpadCore
targets:
  Notchpad:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Notchpad
    dependencies:
      - package: NotchpadCore
    info:
      path: Notchpad/Info.plist
      properties:
        CFBundleDisplayName: Notchpad
        CFBundleShortVersionString: "1.5.3"
        CFBundleVersion: "11"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSAppleEventsUsageDescription: Notchpad shows and controls the song playing in Apple Music or Spotify.
        NSCalendarsFullAccessUsageDescription: Notchpad shows your remaining events for today.
        NSRemindersFullAccessUsageDescription: Notchpad shows your reminders and lets you tick them off.
        NSCameraUsageDescription: The Mirror widget shows your camera, only after you click it.
        NSHumanReadableCopyright: Copyright © 2026 Alperen Gökbak. MIT licence.
    settings:
      base:
        PRODUCT_NAME: Notchpad
        PRODUCT_BUNDLE_IDENTIFIER: com.alperengokbak.notchpad
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        PROVISIONING_PROFILE_SPECIFIER: ""
        # Hardened Runtime: other programs can't inject code into Notchpad and borrow its permissions.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Notchpad/Notchpad.entitlements
        ENABLE_APP_SANDBOX: NO
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
schemes:
  Notchpad:
    build:
      targets:
        Notchpad: all
    run:
      config: Debug
